<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>John Gutter: Fan Game</title>
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <main>
    <div class="stage">
      <canvas id="game" width="960" height="540" tabindex="0" aria-label="John Gutter level"></canvas>

      <div id="menu" class="panel">
        <h1>John Gutter</h1>
        <p>A Pizza Tower fan game. Grab toppings, smash blocks, then escape the tower. Look out for ghost potions, speed potions and bird wings.</p>
        <button id="startBtn" class="big">Start</button>
      </div>

      <div id="difficulty" class="panel hidden">
        <h2>Choose difficulty</h2>
        <div class="choices">
          <button data-diff="easy"><strong>Easy</strong><span>4 minute escape<br>1 lap for a P rank</span></button>
          <button data-diff="medium"><strong>Medium</strong><span>2 minute escape<br>3 laps for a P rank</span></button>
          <button data-diff="hard"><strong>Hard</strong><span>1 minute escape<br>4 laps for a P rank</span></button>
        </div>
        <button id="backBtn" class="small">Back</button>
      </div>
    </div>
    <p class="controls">
      Move: Arrows or A/D &nbsp;|&nbsp; Jump: Space &nbsp;|&nbsp; Run (hold): Shift &nbsp;|&nbsp; Taunt: T &nbsp;|&nbsp; Replay: Enter &nbsp;|&nbsp; Menu: M &nbsp;|&nbsp; Music: N
    </p>
  </main>
  <script src="game.js"></script>
</body>
</html>
